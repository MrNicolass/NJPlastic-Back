######################################### Prod profile overrides ##############################
# Strict overrides applied when the application runs with --spring.profiles.active=prod.
# Goal: every secret/CORS setting MUST come from the environment - no insecure fallbacks.

# Hot-reload off in any prod-like environment (devtools is a no-op outside dev, but explicit).
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# Flyway: only the canonical migrations - dev seed (V2__seed_dev_users.sql) MUST NOT run in prod.
spring.flyway.locations=classpath:db/migration

# JWT secret is required in prod. The build fails fast at startup if JWT_SECRET is unset.
app.security.jwt.secret=${JWT_SECRET}

# CORS allowed origins must be set explicitly per deployment (Client's frontend domain).
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Hide SQL in prod logs (already the default, restated for clarity).
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
