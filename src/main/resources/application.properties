######################################### Base Configs #########################################
spring.application.name=NJPlastic API
server.port=${SERVER_PORT:6000}
spring.devtools.livereload.enabled=true

################################## datasource PostgreSQL ##############################
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.order_by.default_null_ordering=last

spring.datasource.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:30}
spring.datasource.minimum-idle=${HIKARI_MIN_IDLE:30}
spring.datasource.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:60000}
spring.datasource.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.max-lifetime=${HIKARI_IDLE_MAX_LIFETIME:1800000}

spring.datasource.url=jdbc:postgresql://localhost:8125/njplastic
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect