######################################### Base Configs #########################################
spring.application.name=NJPlastic API
server.port=${SERVER_PORT:8111}
spring.devtools.livereload.enabled=true

######################################### JPA / Hibernate ######################################
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.order_by.default_null_ordering=last

######################################### PostgreSQL local (RNF13) ##############################
app.datasource.postgres.jdbc-url=${POSTGRES_URL:jdbc:postgresql://localhost:8025/njplastic}
app.datasource.postgres.username=${POSTGRES_USER:admin}
app.datasource.postgres.password=${POSTGRES_PASSWORD:admin}
app.datasource.postgres.driver-class-name=org.postgresql.Driver
app.datasource.postgres.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:30}
app.datasource.postgres.minimum-idle=${HIKARI_MIN_IDLE:30}
app.datasource.postgres.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:60000}
app.datasource.postgres.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
app.datasource.postgres.max-lifetime=${HIKARI_IDLE_MAX_LIFETIME:1800000}

######################################### ERP DataSource (JDBC puro, RNF13) #####################
# Habilite e configure quando o banco do ERP do Cliente estiver disponivel (SQL Server / Oracle / PostgreSQL).
app.datasource.erp.enabled=${ERP_DATASOURCE_ENABLED:false}
app.datasource.erp.jdbc-url=${ERP_URL:}
app.datasource.erp.username=${ERP_USER:}
app.datasource.erp.password=${ERP_PASSWORD:}
app.datasource.erp.driver-class-name=${ERP_DRIVER:}
app.datasource.erp.maximum-pool-size=${ERP_HIKARI_MAX_POOL_SIZE:5}
app.datasource.erp.minimum-idle=${ERP_HIKARI_MIN_IDLE:1}
app.datasource.erp.connection-timeout=${ERP_HIKARI_CONNECTION_TIMEOUT:30000}

######################################### ERP SQL parametrizado (EP-BE-06 parte 2) ##############
# Schema do ERP do Cliente nao esta congelado: as queries sao injetadas via env para que o mesmo
# binario sirva SQL Server / Oracle / PostgreSQL. Convencoes:
# - find-open-orders: SELECT que retorna colunas erp_order_id, machine_code, product_code,
#     target_quantity, status, payload_json (texto JSON livre).
# - insert-cycle: INSERT idempotente por id (UUID do production_cycle local) - parametros na ordem
#     id, machine_code, pulse_timestamp, sequence, interval_ms.
# - insert-pause: INSERT idempotente por id (UUID do machine_status local) - parametros na ordem
#     id, machine_code, state, reason, message, start_time, end_time, consecutive_count.
# - ping: query de teste de conexao usada pelo endpoint de status.
app.datasource.erp.query.find-open-orders=${ERP_QUERY_FIND_OPEN_ORDERS:}
app.datasource.erp.query.insert-cycle=${ERP_QUERY_INSERT_CYCLE:}
app.datasource.erp.query.insert-pause=${ERP_QUERY_INSERT_PAUSE:}
app.datasource.erp.query.ping=${ERP_QUERY_PING:SELECT 1}

######################################### ERP Sync Scheduler (EP-BE-06 parte 2, RF14) ###########
# fixed-delay-ms: janela entre execucoes da sincronizacao (RF14).
# initial-delay-ms: atraso na primeira execucao apos o startup, para evitar disputa com Flyway/Mqtt.
# history-page-size: numero de execucoes recentes expostas em GET /erp/sync/status (UC08, Figura 26b).
# batch-page-size: limite de registros locais lidos por janela (production_cycle/machine_status awaiting sync).
# kpi-window-hours: janela em horas usada para calcular taxa de sucesso e latencia media em GET /erp/sync/status.
app.erp.sync.fixed-delay-ms=${ERP_SYNC_FIXED_DELAY_MS:60000}
app.erp.sync.initial-delay-ms=${ERP_SYNC_INITIAL_DELAY_MS:30000}
app.erp.sync.history-page-size=${ERP_SYNC_HISTORY_PAGE_SIZE:20}
app.erp.sync.batch-page-size=${ERP_SYNC_BATCH_PAGE_SIZE:200}
app.erp.sync.kpi-window-hours=${ERP_SYNC_KPI_WINDOW_HOURS:24}

######################################### Flyway ###############################################
# Flyway aplica migracoes apenas no PostgreSQL local; consome o bean primary postgresDataSource.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

######################################### Security / JWT (RFC 6.2, EP-BE-02) ###################
# JWT_SECRET must be set via environment in any non-dev profile. No fallback in production.
app.security.jwt.secret=${JWT_SECRET:TVJ03m5/GSPF968V8VVVBXFkrf0ag9HHtZ3z6pY8/gN9KddRyiUa0qjB2PFAPsnEN2ueTfukjjOWecsEW72Ugw==}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.security.jwt.issuer=${JWT_ISSUER:NJPlastic}
# Comma-separated list of allowed origins for CORS (frontend dev server, prod domain).
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Comma-separated list of public (unauthenticated) endpoints. Override the whole list via SECURITY_PUBLIC_PATHS.
app.security.public-paths=${SECURITY_PUBLIC_PATHS:/auth/login,/auth/password-reset,/auth/password-reset/confirm,/swagger-ui.html,/swagger-ui/**,/v3/api-docs,/v3/api-docs/**,/api/v1/versioning,/api/v1/versioning/**}

######################################### Auth cookies (EP-FE-02 pre-req) ######################
# Toggles the Secure flag on the access_token (httpOnly) and access_token_exp (JS-readable) cookies
# emitted by /auth/login and /auth/refresh. Keep true everywhere except local HTTP dev.
app.security.cookies.secure=${COOKIE_SECURE:true}

######################################### Mail / SMTP (EP-BE-02 reopened) #######################
# Dev defaults target a local Mailpit at localhost:1025 (UI 8025). Override every value via env in prod.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
# from: envelope-from used on every outgoing message.
# password-reset-base-url: frontend page that consumes the token (filled on the email link).
# password-reset-ttl-minutes: TTL of password-reset tokens (RFC 6.2).
app.mail.from=${MAIL_FROM:no-reply@njplastic.local}
app.mail.password-reset-base-url=${MAIL_PASSWORD_RESET_BASE_URL:http://localhost:3000/redefinir-senha}
app.mail.password-reset-ttl-minutes=${MAIL_PASSWORD_RESET_TTL_MINUTES:30}

######################################### Reports (EP-BE-08 sub-task 5) #########################
# storage-path: filesystem directory used by ReportGenerationService to persist artifacts.
# retention-days: how long ReportRetentionJob keeps history rows + files (mockup Reports_Part1_V1).
app.reports.storage-path=${REPORTS_STORAGE_PATH:./reports}
app.reports.retention-days=${REPORTS_RETENTION_DAYS:90}

######################################### Auditoria de Requisicoes (EP-BE-03) ###################
# Limite de bytes do payload sanitizado persistido em audit_log; acima disso grava placeholder JSON.
app.audit.max-payload-bytes=${AUDIT_MAX_PAYLOAD_BYTES:10240}

######################################### MQTT (EP-BE-04) ######################################
# Single shared topic; every machine publishes to njplastic/pulso (RFC 5.3). Credentials blank for anonymous brokers.
app.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
app.mqtt.client-id=${MQTT_CLIENT_ID:njplastic-backend}
app.mqtt.topic=${MQTT_TOPIC:njplastic/pulso}
app.mqtt.qos=${MQTT_QOS:1}
app.mqtt.username=${MQTT_USERNAME:}
app.mqtt.password=${MQTT_PASSWORD:}
app.mqtt.clean-session=${MQTT_CLEAN_SESSION:true}
app.mqtt.automatic-reconnect=${MQTT_AUTOMATIC_RECONNECT:true}
app.mqtt.connection-timeout=${MQTT_CONNECTION_TIMEOUT:10}
app.mqtt.keep-alive-interval=${MQTT_KEEP_ALIVE_INTERVAL:60}
# reconnect-interval-ms: periodo do watchdog que tenta reconectar e reassinar o topico quando o broker fica indisponivel.
app.mqtt.reconnect-interval-ms=${MQTT_RECONNECT_INTERVAL_MS:30000}

######################################### Producao / Processamento (EP-BE-04) ###################
# timezone reconstroi o TIMESTAMPTZ do pulso (RN05); clock-tolerance-ms descarta pulsos fora da janela (RN05).
# watchdog-interval-ms e o periodo de varredura do watchdog OFFLINE; auto-stop-message e a mensagem default de PARADA_AUTOMATICA (RF18).
app.production.timezone=${PRODUCTION_TIMEZONE:America/Sao_Paulo}
app.production.clock-tolerance-ms=${CLOCK_TOLERANCE_MS:300000}
app.production.watchdog-interval-ms=${WATCHDOG_INTERVAL_MS:30000}
app.production.auto-stop-message=${AUTO_STOP_MESSAGE:Parada detectada automaticamente apos N pausas consecutivas}
# pause-scan-limit: numero maximo de production_cycle recentes lidos para derivar o contador consecutivo de pausas (RN09).
app.production.pause-scan-limit=${PAUSE_SCAN_LIMIT:200}

######################################### SpringDoc OpenAPI / Swagger UI ########################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false
