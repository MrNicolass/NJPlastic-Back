######################################### Test classpath properties ###########################
# This file fully overrides src/main/resources/application.properties when running tests,
# so every property the context actually needs must be redeclared here.

spring.application.name=NJPlastic API (test)
server.port=0

######################################### JWT (EP-BE-02) #######################################
app.security.jwt.secret=test-secret-only-used-by-junit-do-not-deploy-test-secret-only-used-by-junit-do-not-deploy
app.security.jwt.expiration-minutes=60
app.security.jwt.issuer=NJPlastic-Test
app.security.cors.allowed-origins=http://localhost
app.security.public-paths=/auth/login,/swagger-ui.html,/swagger-ui/**,/v3/api-docs,/v3/api-docs/**,/api/v1/versioning,/api/v1/versioning/**

######################################### Datasource (inherits the main defaults) ##############
# Tests do not connect to a real Postgres; HikariCP only validates the URL string format.
app.datasource.postgres.jdbc-url=${POSTGRES_URL:jdbc:postgresql://localhost:8025/njplastic}
app.datasource.postgres.username=${POSTGRES_USER:admin}
app.datasource.postgres.password=${POSTGRES_PASSWORD:admin}
app.datasource.postgres.driver-class-name=org.postgresql.Driver
app.datasource.postgres.maximum-pool-size=2
app.datasource.postgres.minimum-idle=0
app.datasource.postgres.connection-timeout=2000

app.datasource.erp.enabled=false

######################################### JPA / Flyway off in tests ###########################
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false

######################################### MQTT (bean wiring only - no broker contacted in tests) ###
# MqttConfig refuses to build the IMqttClient bean when client-id is blank. Tests never call
# connect(), so the broker URL never has to resolve - the values just have to satisfy the
# @ConfigurationProperties validation that runs while the application context loads.
app.mqtt.broker-url=tcp://localhost:1883
app.mqtt.client-id=njplastic-backend-test
app.mqtt.topic=njplastic/pulso
app.mqtt.qos=1
app.mqtt.clean-session=true
app.mqtt.automatic-reconnect=false
app.mqtt.connection-timeout=10
app.mqtt.keep-alive-interval=60
app.mqtt.reconnect-interval-ms=30000

######################################### Production / Watchdog (test defaults) ################
app.production.timezone=America/Sao_Paulo
app.production.clock-tolerance-ms=300000
app.production.watchdog-interval-ms=30000
app.production.auto-stop-message=Parada detectada automaticamente apos N pausas consecutivas
app.production.pause-scan-limit=200

######################################### Audit / Reports / Cookies (test defaults) ###########
app.audit.max-payload-bytes=10240
app.reports.storage-path=./target/test-reports
app.reports.retention-days=90
app.security.cookies.secure=false

######################################### Mail (EmailService bean only - no network IO in tests) ###
# A non-empty mail host triggers MailSenderAutoConfiguration, which provides the JavaMailSender
# bean that EmailService and PasswordResetService require to wire up. No real SMTP is contacted
# because the test context only loads the bean graph (no test actually sends an email).
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=test@njplastic.test
app.mail.password-reset-base-url=http://localhost:3000/redefinir-senha
app.mail.password-reset-ttl-minutes=30

######################################### SpringDoc ############################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
