######################################### Test classpath properties ###########################
# This file fully overrides src/main/resources/application.properties when running tests,
# so every property the context actually needs must be redeclared here.

spring.application.name=NJPlastic API (test)
server.port=0

######################################### JWT (EP-BE-02) #######################################
app.security.jwt.secret=test-secret-only-used-by-junit-do-not-deploy-test-secret-only-used-by-junit-do-not-deploy
app.security.jwt.expiration-minutes=60
app.security.jwt.issuer=NJPlastic-Test
app.security.cors.allowed-origins=http://localhost
app.security.public-paths=/auth/login,/swagger-ui.html,/swagger-ui/**,/v3/api-docs,/v3/api-docs/**,/api/v1/versioning,/api/v1/versioning/**

######################################### Datasource (inherits the main defaults) ##############
# Tests do not connect to a real Postgres; HikariCP only validates the URL string format.
app.datasource.postgres.jdbc-url=${POSTGRES_URL:jdbc:postgresql://localhost:8025/njplastic}
app.datasource.postgres.username=${POSTGRES_USER:admin}
app.datasource.postgres.password=${POSTGRES_PASSWORD:admin}
app.datasource.postgres.driver-class-name=org.postgresql.Driver
app.datasource.postgres.maximum-pool-size=2
app.datasource.postgres.minimum-idle=0
app.datasource.postgres.connection-timeout=2000

app.datasource.erp.enabled=false

######################################### JPA / Flyway off in tests ###########################
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false

######################################### SpringDoc ############################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
